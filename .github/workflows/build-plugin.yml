# 构建 Video Studio 的 OTools 插件前端并上传产物。
# 触发：push 到 main、PR、手动。
#
# 本 workflow 只构建**前端**：插件是纯前端的（没有 native cdylib），
# 产物就是 dist/ 这一份静态资源，拷到 otools 仓库的 plugins/otools-puter-video/dist 即可用。
#
# 这里跑的测试是**上游的测试套件**（100 个文件），跑在移植后的构建树上——
# 所以它同时也是移植层的回归：某条 shell/edits.mjs 对不上上游时，
# 不是测试红，而是 `node scripts/build.mjs` 直接报「命中 N 次，期望 M 次」。
name: build-plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 校验上游快照没被就地改过
        run: node scripts/sync-upstream.mjs --check

      - name: 安装依赖
        # --legacy-peer-deps：npm 10 的 arborist 在解析 vitest 5 的
        # 可选 peer（@vitest/browser-playwright）时会崩（edgesOut of null）。
        run: npm ci --legacy-peer-deps

      - name: 跑上游测试套件（跑在移植后的代码上）
        run: node scripts/test.mjs

      - name: 构建 dist/
        run: node scripts/build.mjs

      - name: 打包并自检
        run: |
          node scripts/pack-plugin.mjs
          node scripts/verify-plugin.mjs

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: otools-puter-video-dist
          path: dist/
          if-no-files-found: error

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: otools-puter-video-oplg
          path: dist-pack/
          if-no-files-found: error
