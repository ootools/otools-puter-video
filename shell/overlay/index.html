<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Video Studio</title>
  <meta name="description" content="A multi-track video editor: trim, split, add text, effects, transitions, filters, keyframes and captions, then export. Projects are plain files in a folder on this computer." />
  <meta name="theme-color" content="#f4f4f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16" />
  <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="./favicon-48x48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="./manifest.json" />
  <script>
    // OTools 插件版：**不再加载 https://js.puter.com/v2/**。
    // ------------------------------------------------------------------
    // 上游是「Puter 应用」：靠那个脚本注入 window.puter，再拿 puter.fs 当工程存储、
    // puter.ai 当 AI、puter.auth 当账号。本插件把这些全部去掉（见 README「与上游的差异」），
    // 所以这个页面里 `typeof puter === 'undefined'` 恒成立——上游自己就有「离线/被墙时
    // 退回本地」的分支，AI 与云端入口会各自隐藏，不需要额外改上游代码。
    //
    // 工程存储改由 shell/src/otools/backend.js 接到 OTools 宿主的本地磁盘上。
    //
    // 语言与主题都由宿主的 init script 注入（`documentElement.lang` 与 dark/light 类），
    // 且早于本页任何脚本执行。这段内联脚本只做**首屏之前**必须做完的两件事：
    //   1. 把宿主主题落成上游的初始主题（避免浅色宿主里闪一下深色）；
    //   2. 记住「这个值是跟随宿主写进去的」，之后用户在 Theme 菜单里自己选就不会被覆盖。
    // 语言与后续的实时切换由 shell/src/otools/i18n.js 接管。
    (() => {
      const THEME_KEY = 'video-studio:theme';
      const FOLLOWED_KEY = 'otools-puter-video.theme-followed';
      const read = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
      const write = (key, value) => { try { localStorage.setItem(key, value); } catch { /* 忽略 */ } };

      const classes = document.documentElement.classList;
      const hostTheme = classes.contains('dark') ? 'dark' : classes.contains('light') ? 'light' : '';
      const stored = read(THEME_KEY);
      const followed = read(FOLLOWED_KEY);

      // 用户自己选过（当前值不是我们跟随宿主写的那一个）→ 尊重用户的选择
      let theme = stored && stored !== followed ? stored : '';
      if (!theme && hostTheme) {
        theme = hostTheme;
        write(THEME_KEY, hostTheme);
        write(FOLLOWED_KEY, hostTheme);
      }
      if (!theme) theme = 'system';

      const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      const root = document.documentElement;
      root.dataset.theme = theme;
      root.dataset.themeResolved = dark ? 'dark' : 'light';
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to editor</a>
  <div id="app" class="app" aria-busy="true"></div>
  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
